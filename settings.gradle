pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        mavenCentral()
    }
}

rootProject.name = 'mcef'
// 'fabric' is temporarily dropped: it applies fabric-loom, which can't parse Minecraft 26.2's
// class files yet (no Fabric toolchain support for this version). Re-add once Loom catches up.
include('common', 'neoforge')